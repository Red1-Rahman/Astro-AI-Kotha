name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Install spaCy English model
        run: |
          python -m spacy download en_core_web_sm

      - name: Check import boundaries
        run: |
          python -c "
          import ast
          from pathlib import Path

          ROOTS = {
              'chatbot': 0,
              'speech': 1,
              'translation': 2,
          }

          violations = []

          for root, layer in ROOTS.items():
              for path in Path(root).rglob('*.py'):
                  tree = ast.parse(
                      path.read_text(encoding='utf-8'),
                      filename=str(path),
                  )

                  for node in ast.walk(tree):
                      imported = None

                      if isinstance(node, ast.Import):
                          for alias in node.names:
                              imported = alias.name.split('.')[0]

                              if (
                                  imported in ROOTS
                                  and ROOTS[imported] < layer
                              ):
                                  violations.append(
                                      f'{path}: '
                                      f'{root} -> {imported}'
                                  )

                      elif isinstance(node, ast.ImportFrom):
                          if node.level != 0:
                              continue

                          if node.module:
                              imported = node.module.split('.')[0]

                              if (
                                  imported in ROOTS
                                  and ROOTS[imported] < layer
                              ):
                                  violations.append(
                                      f'{path}: '
                                      f'{root} -> {imported}'
                                  )

          if violations:
              print('Import boundary violations:')
              print('\\n'.join(violations))
              raise SystemExit(1)

          print('Import boundaries OK.')
          "

      - name: Check module exports and imports
        run: |
          python -c "
          import importlib

          modules = [
              'chatbot.faq_loader',
              'chatbot.language_detector',
              'chatbot.matcher',
              'chatbot.nlp_processor',
              'chatbot.response_builder',
              'chatbot.sanitizer.english_sanitizer',
              'chatbot.sanitizer.bangla_sanitizer',
              'chatbot.sanitizer.banglish_sanitizer',
              'chatbot.sanitizer.router',
              'speech.transcriber',
              'speech.synthesizer',
              'translation.translator',
              'translation.local_translator',
              'translation.azure_translator',
              'main',
          ]

          failures = []

          for module_name in modules:
              try:
                  module = importlib.import_module(module_name)
                  print(f'OK: {module_name}')
              except Exception as exc:
                  failures.append(
                      f'{module_name}: '
                      f'{type(exc).__name__}: {exc}'
                  )

          if failures:
              print('\\nImport failures:')
              print('\\n'.join(failures))
              raise SystemExit(1)
          "

      - name: Run Pyright
        run: |
          pyright

      - name: Run tests
        run: |
          python -m pytest
