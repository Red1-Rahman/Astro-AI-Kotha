[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"


[project]
name = "astro-ai-kotha"
version = "0.1.0"
description = "Voice-enabled FAQ and support interface for the Astro-AI Galaxy Evolution Analysis Platform."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Redwan Rahman" }
]
keywords = [
    "astro-ai",
    "faq",
    "chatbot",
    "voice-assistant",
    "speech-to-text",
    "text-to-speech",
    "fastapi",
    "nlp"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "numpy>=1.26.0,<3.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "spacy>=3.7.0,<4.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0"
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "pyright>=1.1.380,<2.0.0",
    "ruff>=0.6.0,<1.0.0"
]


[project.urls]
Homepage = "https://github.com/Red1-Rahman/Astro-AI-Kotha"
Repository = "https://github.com/Red1-Rahman/Astro-AI-Kotha"
Issues = "https://github.com/Red1-Rahman/Astro-AI-Kotha/issues"


[tool.setuptools]
include-package-data = true


[tool.setuptools.packages.find]
include = [
    "chatbot*",
    "speech*",
    "translation*"
]


[tool.ruff]
target-version = "py311"
line-length = 88
src = [
    "chatbot",
    "speech",
    "translation",
    "tests"
]

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist"
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM"
]

ignore = [
    "E501"
]


[tool.ruff.lint.isort]
known-first-party = [
    "chatbot",
    "speech",
    "translation"
]


[tool.pyright]
include = [
    "chatbot",
    "speech",
    "translation",
    "main.py",
    "tests"
]

exclude = [
    "**/__pycache__",
    ".venv",
    "venv",
    "build",
    "dist"
]

pythonVersion = "3.11"
typeCheckingMode = "strict"

reportMissingImports = true
reportMissingTypeStubs = false


[tool.pytest.ini_options]
testpaths = [
    "tests"
]

python_files = [
    "test_*.py",
    "*_test.py"
]

python_classes = [
    "Test*"
]

python_functions = [
    "test_*"
]

addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=chatbot",
    "--cov=speech",
    "--cov=translation",
    "--cov=main",
    "--cov-report=term-missing"
]

asyncio_mode = "auto"


[tool.coverage.run]
branch = true
source = [
    "chatbot",
    "speech",
    "translation"
]


[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError"
]

show_missing = true
skip_covered = true
